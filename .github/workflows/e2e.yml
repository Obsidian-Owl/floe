# Manual end-to-end validation. Scheduled E2E runs live in weekly.yml, and
# release-blocking E2E/live validation lives in prepare-release.yml.

name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION_DEFAULT: "3.10"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: floe-test
          version: v0.24.0
          node_image: kindest/node:v1.31.0

      - name: Set up Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.16.0

      - name: Install Flux CLI
        run: |
          FLUX_VERSION="2.5.1"
          FLUX_ARCHIVE="flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/${FLUX_ARCHIVE}" -o "/tmp/${FLUX_ARCHIVE}"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_checksums.txt" -o /tmp/flux_checksums.txt
          grep " ${FLUX_ARCHIVE}$" /tmp/flux_checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${FLUX_ARCHIVE}" -C /tmp
          sudo install /tmp/flux /usr/local/bin/flux
          rm -f "/tmp/${FLUX_ARCHIVE}" /tmp/flux /tmp/flux_checksums.txt
          flux --version

      - name: Pre-pull and load heavy images into Kind
        run: |
          for img in \
            apache/polaris:1.2.0-incubating \
            postgres:16-alpine \
            minio/minio:RELEASE.2024-09-13T20-26-02Z \
            jaegertracing/all-in-one:1.60; do
            docker pull "$img"
            kind load docker-image "$img" --name floe-test
          done

      - name: Deploy floe-platform
        run: ./testing/k8s/setup-cluster.sh
        env:
          SKIP_MONITORING: "true"

      - name: Run E2E (standard + destructive)
        run: make test-e2e-full
        env:
          IMAGE_LOAD_METHOD: kind

      - name: Collect debug artifacts on failure
        if: failure()
        run: |
          kubectl get pods,jobs,events -A -o wide || true
          kubectl logs -n floe-test -l app.kubernetes.io/component=test-runner --tail=200 || true
          kubectl logs -n floe-test deployment/floe-platform-polaris --tail=100 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-results
          path: |
            test-artifacts/
            /tmp/floe-*.log
            e2e-results.xml
            e2e-destructive-results.xml
          if-no-files-found: warn
          retention-days: 7
