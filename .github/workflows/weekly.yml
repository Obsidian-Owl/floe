# Weekly Pipeline - Scheduled integration tests and dependency audit
#
# Runs at 2am UTC every Monday to catch:
# - Integration test regressions
# - Dependency vulnerabilities
# - Stale dependencies
#
# Security: workflow_dispatch inputs are trusted (repo collaborators only).
# All run: blocks use static commands or env vars — no untrusted interpolation.
#
# See .github/CI.md for workflow documentation

name: Weekly

on:
  schedule:
    # Run at 2am UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        default: true
        type: boolean
      run_audit:
        description: 'Run dependency audit'
        required: false
        default: true
        type: boolean
      run_cube_build:
        description: 'Build Cube Store image'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION_DEFAULT: "3.10"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ============================================================
  # Integration Tests (K8s-native with Kind)
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_integration == true }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install dbt Fusion CLI
        run: |
          # Install official dbt Fusion CLI from dbt Labs
          # Download first, then execute (CWE-78 mitigation — no pipe-to-shell)
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh -o /tmp/dbt-install.sh
          chmod +x /tmp/dbt-install.sh
          /tmp/dbt-install.sh --update
          rm -f /tmp/dbt-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/dbt --version

      - name: Install Flux CLI
        run: |
          FLUX_VERSION="2.5.1"
          FLUX_ARCHIVE="flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/${FLUX_ARCHIVE}" -o "/tmp/${FLUX_ARCHIVE}"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_checksums.txt" -o /tmp/flux_checksums.txt
          grep " ${FLUX_ARCHIVE}$" /tmp/flux_checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${FLUX_ARCHIVE}" -C /tmp
          sudo install /tmp/flux /usr/local/bin/flux
          rm -f "/tmp/${FLUX_ARCHIVE}" /tmp/flux /tmp/flux_checksums.txt
          flux --version

      - name: Setup Kind cluster and deploy services
        run: CLUSTER_NAME=floe-weekly ./testing/k8s/setup-cluster.sh
        env:
          SKIP_MONITORING: "true"

      - name: Run integration tests
        run: ./testing/ci/test-integration.sh
        env:
          TEST_NAMESPACE: floe-test
          KIND_CLUSTER_NAME: floe-weekly

      - name: Collect logs on failure
        if: failure()
        run: ./testing/ci/collect-logs.sh floe-test

      - name: Cleanup Kind cluster
        if: always()
        run: kind delete cluster --name floe-weekly || true

  # ============================================================
  # E2E Tests (K8s-native with Kind)
  # ============================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_integration == true }}
    needs: [integration-tests]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install dbt Fusion CLI
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh -o /tmp/dbt-install.sh
          chmod +x /tmp/dbt-install.sh
          /tmp/dbt-install.sh --update
          rm -f /tmp/dbt-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/dbt --version

      - name: Install Flux CLI
        run: |
          FLUX_VERSION="2.5.1"
          FLUX_ARCHIVE="flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/${FLUX_ARCHIVE}" -o "/tmp/${FLUX_ARCHIVE}"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_checksums.txt" -o /tmp/flux_checksums.txt
          grep " ${FLUX_ARCHIVE}$" /tmp/flux_checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${FLUX_ARCHIVE}" -C /tmp
          sudo install /tmp/flux /usr/local/bin/flux
          rm -f "/tmp/${FLUX_ARCHIVE}" /tmp/flux /tmp/flux_checksums.txt
          flux --version

      - name: Setup Kind cluster and deploy services
        run: CLUSTER_NAME=floe-e2e ./testing/k8s/setup-cluster.sh
        env:
          SKIP_MONITORING: "true"

      - name: Run standard E2E tests
        run: ./testing/ci/test-integration.sh
        env:
          TEST_SUITE: e2e
          TEST_NAMESPACE: floe-test
          KIND_CLUSTER_NAME: floe-e2e
          WAIT_TIMEOUT: "1800"

      - name: Run destructive E2E tests
        if: success()
        run: ./testing/ci/test-integration.sh
        env:
          TEST_SUITE: e2e-destructive
          TEST_NAMESPACE: floe-test
          KIND_CLUSTER_NAME: floe-e2e
          SKIP_BUILD: "true"
          WAIT_TIMEOUT: "900"

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-test-results
          path: |
            e2e-results.xml
            e2e-destructive-results.xml
          if-no-files-found: warn

      - name: Collect logs on failure
        if: failure()
        run: ./testing/ci/collect-logs.sh floe-test

      - name: Cleanup Kind cluster
        if: always()
        run: kind delete cluster --name floe-e2e || true

  # ============================================================
  # Dependency Audit
  # ============================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_audit == true }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run vulnerability audit
        uses: ./.github/actions/uv-security-audit

      - name: Check for stale dependencies
        run: |
          echo "Checking for outdated dependencies..."
          uv pip list --outdated || true

  # ============================================================
  # Cube Store Build
  # ============================================================
  # Upstream cubejs/cubestore is AMD64-only (no ARM64 manifest).
  # This job rebuilds and pushes to GHCR for supply chain pinning.
  build-cube-store:
    name: Build Cube Store
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_cube_build == true }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Cube Store
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: docker/cube-store
          platforms: linux/amd64
          push: true
          tags: ghcr.io/obsidian-owl/cube-store:0.36.0,ghcr.io/obsidian-owl/cube-store:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Failure Issue
  # ============================================================
  failure-issue:
    name: Failure Issue
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests, dependency-audit, build-cube-store]
    if: ${{ failure() }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build issue content
        run: |
          set -euo pipefail
          uv run python -m testing.release.cli failure-issue \
            --lane weekly-validation \
            --gate weekly \
            --classification product \
            --sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --log-excerpt "See weekly workflow artifacts and failed job logs." \
            --cleanup-status not-run \
            --output issue.json

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="$(python -c 'import json; print(json.load(open("issue.json"))["title"])')"
          body="$(python -c 'import json; print(json.load(open("issue.json"))["body"])')"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "$title" \
              --body "$body" \
              --label ci \
              --label weekly-failure
          fi
