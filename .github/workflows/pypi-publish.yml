# PyPI Package Publishing - builds and publishes release manifest packages
#
# Triggers on version tags (v*.*.*) after the Release workflow validates.
# Uses account-scoped PyPI API token stored as PYPI_API_TOKEN secret.
# Each manifest-published package is built independently and uploaded in a single job.
#
# Prerequisites:
#   - PYPI_API_TOKEN secret configured in GitHub environment "pypi"
#   - See docs/guides/pypi-trusted-publishers.md for future OIDC migration
#
# Security: all run: blocks use static commands. No untrusted interpolation.
# GITHUB_REF is safe for tag triggers (not user-controlled content).

name: PyPI Publish

permissions: {}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build packages without uploading (test mode)'
        required: false
        default: true
        type: boolean

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION_DEFAULT: "3.10"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install workspace dependencies
        run: uv sync --all-extras --dev

      - name: Extract version from tag
        id: version
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF: ${{ github.ref }}
        run: |
          if [[ "${GH_REF_TYPE}" == "tag" ]]; then
            VERSION="${GH_REF#refs/tags/v}"
          else
            VERSION="0.0.0.dev0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Validate release manifest
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${GH_REF_TYPE}" == "tag" ]]; then
            uv run python -m testing.release.cli validate \
              --manifest release/floe-release.yaml \
              --tag "${GH_REF#refs/tags/}"
          else
            uv run python -m testing.release.cli validate \
              --manifest release/floe-release.yaml
          fi

      - name: Build manifest packages
        run: |
          set -euo pipefail
          uv run python -m testing.release.cli build \
            --manifest release/floe-release.yaml \
            --dist-dir dist

          echo "=== Built artifacts ==="
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: python-packages
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag' && !(inputs.dry_run || false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install workspace dependencies
        run: uv sync --all-extras --dev

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: python-packages
          path: dist/

      - name: Verify artifacts
        run: |
          echo "=== Artifacts to publish ==="
          ls -la dist/
          EXPECTED=$(uv run python - <<'PY'
          from pathlib import Path

          from testing.release.manifest import load_release_manifest

          manifest = load_release_manifest(Path("release/floe-release.yaml"))
          print(len(manifest.python_packages.publish))
          PY
          )
          WHEEL_COUNT=$(find dist/ -name '*.whl' | wc -l)
          SDIST_COUNT=$(find dist/ -name '*.tar.gz' | wc -l)
          echo "Wheels: ${WHEEL_COUNT}, Sdists: ${SDIST_COUNT}, Expected per type: ${EXPECTED}"
          if [[ "${WHEEL_COUNT}" -ne "${EXPECTED}" || "${SDIST_COUNT}" -ne "${EXPECTED}" ]]; then
            echo "::error::Expected ${EXPECTED} wheels and ${EXPECTED} sdists, got ${WHEEL_COUNT} wheels and ${SDIST_COUNT} sdists"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
          verbose: true

  verify:
    name: Verify Published Packages
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Wait for PyPI index propagation
        run: sleep 30

      - name: Verify core package installable
        run: |
          pip install "floe-core==${RELEASE_VERSION}" --no-deps --dry-run || {
            echo "::warning::floe-core not yet available on PyPI (index propagation may take a few minutes)"
          }
