# Release Pipeline - runs on tags for formal releases
# Integration tests and E2E validation run here (not on every PR)
#
# Triggers:
#   - Push to tags matching v*.*.*
#   - Manual workflow_dispatch for testing
#
# Best practice: Fast tests (lint, unit) on PRs, slow tests (integration, E2E) on releases
# See: https://docs.github.com/en/actions/guides/about-continuous-integration

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        default: true
        type: boolean

# Only one release at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION_DEFAULT: "3.10"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ============================================================
  # Validate: Quick checks before expensive tests
  # ============================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate release manifest
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            uv run python -m testing.release.cli validate --manifest release/floe-release.yaml --tag "${GITHUB_REF_NAME}"
          else
            uv run python -m testing.release.cli validate --manifest release/floe-release.yaml
          fi

      - name: Run quick validation
        run: |
          uv run ruff check .
          uv run mypy --strict packages/ testing/

  # ============================================================
  # Integration Tests (K8s-native with Kind)
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.run_integration == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: floe-release
          config: testing/k8s/kind-config.yaml

      - name: Deploy test services
        run: |
          kubectl apply -f testing/k8s/services/namespace.yaml
          kubectl apply -f testing/k8s/services/

      - name: Wait for services to be ready
        run: |
          kubectl wait --for=condition=ready pods --all -n floe-test --timeout=300s || true
          kubectl get pods -n floe-test

      - name: Run integration tests
        run: ./testing/ci/test-integration.sh
        env:
          TEST_NAMESPACE: floe-test

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl get pods -n floe-test -o wide
          kubectl logs -n floe-test --all-containers --tail=50 -l app || true

      - name: Cleanup Kind cluster
        if: always()
        run: kind delete cluster --name floe-release || true

  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, integration-tests]
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate release evidence variables
        run: |
          set -euo pipefail
          for var_name in RELEASE_DEVPOD_ARTIFACT RELEASE_AWS_LIVE_RESULT RELEASE_CLEANUP_RESULT; do
            if [[ -z "${!var_name}" ]]; then
              echo "::error::Repository variable ${var_name} must be configured before creating a release."
              exit 1
            fi
          done
        env:
          RELEASE_DEVPOD_ARTIFACT: ${{ vars.RELEASE_DEVPOD_ARTIFACT }}
          RELEASE_AWS_LIVE_RESULT: ${{ vars.RELEASE_AWS_LIVE_RESULT }}
          RELEASE_CLEANUP_RESULT: ${{ vars.RELEASE_CLEANUP_RESULT }}

      - name: Validate and write release evidence summary
        run: |
          uv run python -m testing.release.cli evidence-summary \
            --release-sha "${GITHUB_SHA}" \
            --manifest release/floe-release.yaml \
            --devpod-artifact "${RELEASE_DEVPOD_ARTIFACT}" \
            --aws-live-result "${RELEASE_AWS_LIVE_RESULT}" \
            --cleanup-result "${RELEASE_CLEANUP_RESULT}" \
            --output release-evidence.md
        env:
          RELEASE_DEVPOD_ARTIFACT: ${{ vars.RELEASE_DEVPOD_ARTIFACT }}
          RELEASE_AWS_LIVE_RESULT: ${{ vars.RELEASE_AWS_LIVE_RESULT }}
          RELEASE_CLEANUP_RESULT: ${{ vars.RELEASE_CLEANUP_RESULT }}

      - name: Write release metadata
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "version": os.environ["RELEASE_VERSION"],
          }
          Path("release-metadata/release-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata
          path: release-metadata/release-metadata.json
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974  # v2
        with:
          name: Release ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: release-evidence.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
