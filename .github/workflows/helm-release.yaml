# Helm Chart Release Pipeline
#
# Publishes Helm charts to:
# 1. GitHub Pages (traditional Helm repo)
# 2. OCI Registry (GHCR)
#
# Triggered by tags matching 'helm-v*' or 'charts-v*'
#
# Requirements:
# - 9b-FR-073: Chart release workflow
# - 9b-FR-074: OCI registry push

name: Helm Release

on:
  push:
    tags:
      - 'helm-v*'
      - 'charts-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional chart version override (defaults to release/floe-release.yaml)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # ============================================================
  # Stage 1: Validate and Build Charts
  # ============================================================
  build:
    name: Build Charts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.14.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Extract version and chart list
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(uv run python -c 'from pathlib import Path; from testing.release.manifest import load_release_manifest; print(load_release_manifest(Path("release/floe-release.yaml")).release.helm_version)')
          fi

          CHART_PATHS=$(uv run python -c 'from pathlib import Path; from testing.release.manifest import load_release_manifest; print("\n".join(load_release_manifest(Path("release/floe-release.yaml")).helm.charts))')

          {
            echo "version=${VERSION}"
            echo "chart_paths<<EOF"
            echo "${CHART_PATHS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Chart version: ${VERSION}"
          echo "Chart paths:"
          echo "${CHART_PATHS}"

      - name: Validate Helm alpha policy
        run: |
          set -euo pipefail
          uv run python -m testing.release.cli validate --manifest release/floe-release.yaml

      - name: Add Helm repositories
        run: |
          helm repo add dagster https://dagster-io.github.io/helm
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Update chart dependencies
        env:
          CHART_PATHS: ${{ steps.version.outputs.chart_paths }}
        run: |
          while IFS= read -r chart_path; do
            [ -n "${chart_path}" ] || continue
            helm dependency update "${chart_path}"
          done <<< "${CHART_PATHS}"

      - name: Lint charts
        env:
          CHART_PATHS: ${{ steps.version.outputs.chart_paths }}
        run: |
          while IFS= read -r chart_path; do
            [ -n "${chart_path}" ] || continue
            helm lint "${chart_path}" --values "${chart_path}/values.yaml"
          done <<< "${CHART_PATHS}"

      - name: Package charts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART_PATHS: ${{ steps.version.outputs.chart_paths }}
        run: |
          mkdir -p dist
          while IFS= read -r chart_path; do
            [ -n "${chart_path}" ] || continue
            helm package "${chart_path}" --version "${VERSION}" --destination dist/
          done <<< "${CHART_PATHS}"
          ls -la dist/

      - name: Upload chart artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-charts
          path: dist/*.tgz
          retention-days: 7

  # ============================================================
  # Stage 2: Publish to GitHub Pages
  # ============================================================
  publish-pages:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download chart artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-charts
          path: charts-new

      - name: Set up Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.14.0

      - name: Update repository index
        run: |
          # Move new charts to root
          mv -- charts-new/*.tgz . 2>/dev/null || true
          rmdir charts-new 2>/dev/null || true

          # Generate/update index.yaml
          if [ -f index.yaml ]; then
            helm repo index . --merge index.yaml
          else
            helm repo index .
          fi

          # List charts
          echo "Charts in repository:"
          ls -la ./*.tgz 2>/dev/null || echo "No chart packages found"
          echo ""
          echo "Index content:"
          head -50 index.yaml

      - name: Commit and push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release Helm charts ${VERSION}" || echo "No changes to commit"
          git push

  # ============================================================
  # Stage 3: Push to OCI Registry (GHCR)
  # ============================================================
  publish-oci:
    name: Publish to OCI Registry
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Download chart artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-charts
          path: dist

      - name: Set up Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.14.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login "${REGISTRY}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Login Cosign to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to OCI registry
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for chart in dist/*.tgz; do
            echo "Pushing ${chart} to OCI registry..."
            helm push "${chart}" "oci://${REGISTRY_PATH}"
          done

          echo ""
          echo "Charts published to:"
          for chart in dist/*.tgz; do
            base=$(basename "${chart}" .tgz)
            chart_name=${base%"-${VERSION}"}
            echo "  oci://${REGISTRY_PATH}/${chart_name}:${VERSION}"
          done
          echo ""
          echo "Install with:"
          echo "  helm install floe oci://${REGISTRY_PATH}/floe-platform --version ${VERSION}"

      - name: Sign OCI charts
        continue-on-error: true
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for chart in dist/*.tgz; do
            base=$(basename "${chart}" .tgz)
            chart_name=${base%"-${VERSION}"}
            chart_ref="${REGISTRY_PATH}/${chart_name}:${VERSION}"
            echo "Signing ${chart_ref}..."
            if ! cosign sign --yes "${chart_ref}"; then
              echo "WARNING: Failed to sign ${chart_name}" >&2
            fi
          done

  # ============================================================
  # Stage 4: Create GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-pages, publish-oci]
    permissions:
      contents: write
    steps:
      - name: Download chart artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-charts
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        env:
          VERSION: ${{ needs.build.outputs.version }}
        with:
          name: "Helm Charts ${{ needs.build.outputs.version }}"
          body: |
            ## Helm Charts Release ${{ needs.build.outputs.version }}

            ### Installation

            **Via Helm Repository:**
            ```bash
            helm repo add floe https://${{ github.repository_owner }}.github.io/floe
            helm repo update
            helm install floe floe/floe-platform --version ${{ needs.build.outputs.version }}
            ```

            **Via OCI Registry:**
            ```bash
            helm install floe oci://ghcr.io/${{ github.repository_owner }}/charts/floe-platform --version ${{ needs.build.outputs.version }}
            ```

            ### Charts Included
            - floe-platform: Platform infrastructure (Dagster, Polaris, PostgreSQL, MinIO)
            - floe-jobs: Job definitions (dbt, ingestion, custom jobs)

            ### Documentation
            - [Chart README](charts/floe-platform/README.md)
            - [Deployment Guide](docs/deployment.md)
          files: dist/*.tgz
          fail_on_unmatched_files: true
