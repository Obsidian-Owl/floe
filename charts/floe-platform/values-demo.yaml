# Demo-specific overrides for floe-platform
# Usage: helm install floe-platform ./charts/floe-platform -f charts/floe-platform/values-demo.yaml
#
# This file configures the platform for local demonstration:
# - Reduced resource requirements for Kind cluster
# - Demo-specific scheduling (10-minute intervals)
# - Marquez enabled for lineage visualization
# - Short retention periods for demo data

# =============================================================================
# Global Demo Configuration
# =============================================================================
global:
  environment: demo

dagsterDemoImage: &dagsterDemoImage
  repository: floe-dagster-demo
  tag: latest
  pullPolicy: Never

# Override fullname to decouple service names from Helm release name
fullnameOverride: floe-platform

# =============================================================================
# Dagster Configuration (Orchestration)
# =============================================================================
dagster:
  # Demo code locations - Python module-based loading
  # Each demo product appears as a separate code location in Dagster UI
  # Data engineers only write: floe.yaml + dbt models
  # Platform auto-discovers products via definitions.py
  codeLocations:
    - name: customer-360
      pythonModule:
        moduleName: customer_360.definitions
        workingDirectory: /app/demo
        attribute: defs
    - name: iot-telemetry
      pythonModule:
        moduleName: iot_telemetry.definitions
        workingDirectory: /app/demo
        attribute: defs
    - name: financial-risk
      pythonModule:
        moduleName: financial_risk.definitions
        workingDirectory: /app/demo
        attribute: defs

  # Dagster webserver configuration
  dagsterWebserver:
    replicaCount: 1
    image:
      <<: *dagsterDemoImage
    service:
      type: ClusterIP
      port: 3000
    readinessProbe:
      httpGet:
        path: /server_info
        port: 3000
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 3
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 2Gi
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://floe-platform-otel:4317"
      - name: OTEL_SERVICE_NAME
        value: "floe-platform"
      - name: POLARIS_CREDENTIAL
        valueFrom:
          secretKeyRef:
            name: floe-platform-polaris-credentials
            key: POLARIS_CREDENTIAL

  # Dagster daemon configuration
  dagsterDaemon:
    enabled: true
    image:
      <<: *dagsterDemoImage
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 2Gi
    # Demo scheduling: 10-minute intervals
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://floe-platform-otel:4317"
      - name: OTEL_SERVICE_NAME
        value: "floe-platform"
      - name: DAGSTER_DEFAULT_SCHEDULE_CRON
        value: "*/10 * * * *"
      - name: POLARIS_CREDENTIAL
        valueFrom:
          secretKeyRef:
            name: floe-platform-polaris-credentials
            key: POLARIS_CREDENTIAL

  # Run launcher configuration
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        image:
          <<: *dagsterDemoImage
        imagePullPolicy: Never
        # Run pods execute dbt, which writes partial-parse and run artifacts
        # into /app/demo/*/target. Keep this aligned with values-test.yaml.
        runK8sConfig:
          containerConfig:
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: floe-platform-minio
                    key: root-user
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: floe-platform-minio
                    key: root-password
              - name: AWS_REGION
                value: us-east-1
              - name: POLARIS_CREDENTIAL
                valueFrom:
                  secretKeyRef:
                    name: floe-platform-polaris-credentials
                    key: POLARIS_CREDENTIAL
              - name: POLARIS_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: floe-platform-polaris-credentials
                    key: client-id
              - name: POLARIS_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: floe-platform-polaris-credentials
                    key: client-secret
              - name: POLARIS_SCOPE
                value: PRINCIPAL_ROLE:ALL
              - name: POLARIS_OAUTH2_SERVER_URI
                value: http://floe-platform-polaris:8181/api/catalog/v1/oauth/tokens
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                  - ALL
        # Resources for run pods (light for demo)
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

# =============================================================================
# Polaris Configuration (Iceberg Catalog - Demo)
# =============================================================================
polaris:
  enabled: true
  replicaCount: 1
  image:
    tag: "1.2.0-incubating"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
  auth:
    # Demo credentials for local development only - production MUST use existingSecret
    bootstrapCredentials:
      clientId: "demo-admin"  # pragma: allowlist secret
      clientSecret: "demo-secret"  # pragma: allowlist secret
  config:
    features:
      # Must be "false" for pathStyleAccess to reach S3FileIO.
      # stsUnavailable: true in storageConfigInfo prevents STS calls.
      SKIP_CREDENTIAL_SUBSCOPING_INDIRECTION: "false"
      ALLOW_SETTING_S3_ENDPOINTS: "true"
      ALLOW_TABLE_LOCATION_OVERLAP: "false"
  storage:
    s3:
      enabled: true
      endpoint: "http://floe-platform-minio:9000"
      region: "us-east-1"
      pathStyleAccess: true
      credentialSecretName: "floe-platform-minio"  # pragma: allowlist secret
      accessKeySecretKey: "root-user"  # pragma: allowlist secret
      secretKeySecretKey: "root-password"  # pragma: allowlist secret
  bootstrap:
    enabled: true
    catalogName: "floe-demo"
    # Keep this bucket contract aligned with demo/manifest.yaml.
    defaultBaseLocation: "s3://floe-iceberg"
    allowedLocations:
      - "s3://floe-iceberg"
    grants:
      enabled: true
      catalogRole: "catalog_admin"
      principalRole: "floe-pipeline"
      bootstrapPrincipal: "root"
      privileges:
        - CATALOG_MANAGE_CONTENT

# =============================================================================
# OpenTelemetry Collector Configuration (Observability)
# =============================================================================
otel:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    exporters:
      debug:
        verbosity: detailed
      prometheus:
        endpoint: 0.0.0.0:9464
        namespace: floe
      otlphttp/loki:
        endpoint: http://floe-platform-loki:3100/otlp
      otlp/jaeger:
        endpoint: "{{ .Release.Name }}-jaeger-collector:4317"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
  ports:
    prometheus:
      enabled: true
      containerPort: 9464
      servicePort: 9464
      protocol: TCP

# =============================================================================
# Loki Configuration (Queryable Logs - Demo)
# =============================================================================
loki:
  enabled: true

# =============================================================================
# Prometheus Configuration (Queryable Metrics - Demo)
# =============================================================================
prometheus:
  enabled: true

# =============================================================================
# PostgreSQL Configuration (Metadata Store)
# =============================================================================
postgresql:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      ephemeral-storage: 1Gi
  persistence:
    enabled: true
    size: 2Gi  # Reduced for demo

# =============================================================================
# MinIO Configuration (Object Storage - Demo)
# =============================================================================
minio:
  # Enable MinIO for demo (not recommended for production)
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi  # Reduced for demo
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin123  # pragma: allowlist secret
  provisioning:
    # The upstream minio/minio image does not honor the Bitnami chart's
    # defaultBuckets bootstrap contract. Keep demo aligned with the validated
    # E2E profile by using the chart-owned fallback hook, which derives the
    # warehouse bucket from polaris.bootstrap.defaultBaseLocation.
    fallbackJob: true
  # Keep this list aligned with demo/manifest.yaml so the demo install path
  # exposes the same bucket contract the data-product manifest advertises.
  defaultBuckets: "floe-iceberg,floe-artifacts"

# =============================================================================
# Jaeger Configuration (Distributed Tracing - Demo Visualization)
# =============================================================================
jaeger:
  enabled: true
  provisionDataStore:
    cassandra: false
  allInOne:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  collector:
    enabled: false
  query:
    enabled: false
  agent:
    enabled: false
  cassandra:
    persistence:
      enabled: false
  storage:
    type: memory

# =============================================================================
# Marquez Configuration (OpenLineage - Demo Visualization)
# =============================================================================
marquez:
  # Enable Marquez for lineage visualization in demos
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Demo uses shared PostgreSQL
  postgresql:
    host: ""  # Uses shared PostgreSQL (auto-configured)
    database: marquez
    username: floe

# =============================================================================
# Demo-Specific Configuration
# =============================================================================
demo:
  enabled: true
  # Demo data seeding scale (small|medium|large)
  # Overridable via FLOE_DEMO_SEED_SCALE environment variable
  seedScale: "small"
  # Data retention: 1 hour for demo (keeps demo data fresh)
  retentionHours: 1
  # Keep last 6 snapshots for time travel demonstration
  snapshotKeepLast: 6

# =============================================================================
# Cube Configuration (Semantic Layer - Demo)
# =============================================================================
cube:
  enabled: true

# =============================================================================
# Observability Configuration (Grafana Datasources - Demo)
# =============================================================================
observability:
  grafana:
    enabled: true
    refreshInterval: 30s
    datasourceUid: prometheus
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://floe-platform-prometheus:9090
        isDefault: true
        editable: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: "http://{{ .Release.Name }}-jaeger-query:16686"
        editable: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: "http://{{ .Values.fullnameOverride | default .Release.Name }}-loki:3100"
        editable: true
