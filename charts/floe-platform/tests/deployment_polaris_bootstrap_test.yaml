# Unit A: Polaris guarded bootstrap deployment tests
# Covers RAC-2 and RAC-3 for the Polaris bootstrap recovery work unit.
suite: polaris guarded bootstrap deployment
templates:
  - templates/configmap-polaris.yaml
  - templates/deployment-polaris.yaml
tests:
  - it: should render guarded bootstrap init containers in relational-jdbc mode
    template: templates/deployment-polaris.yaml
    set:
      polaris.enabled: true
      polaris.persistence.type: relational-jdbc
      polaris.persistence.jdbc.url: jdbc:postgresql://floe-platform-postgresql:5432/polaris
      polaris.persistence.jdbc.username: floe
      polaris.auth.bootstrapCredentials.clientId: demo-admin
      polaris.auth.bootstrapCredentials.clientSecret: demo-secret  # pragma: allowlist secret
    asserts:
      - isKind:
          of: Deployment
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 3
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: check-polaris-bootstrap
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: bootstrap-polaris-metastore
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.initContainers[0].env[0].name
          value: JDBC_URL

  - it: should omit guarded bootstrap init containers in in-memory mode
    template: templates/deployment-polaris.yaml
    set:
      polaris.enabled: true
      polaris.persistence.type: in-memory
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.initContainers

  - it: should source runtime S3 credentials from configured storage secret keys
    template: templates/deployment-polaris.yaml
    set:
      polaris.enabled: true
      polaris.storage.s3.enabled: true
      polaris.storage.s3.endpoint: "http://minio:9000"
      polaris.storage.s3.credentialSecretName: "floe-platform-minio-credentials"  # pragma: allowlist secret
      polaris.storage.s3.accessKeySecretKey: "root-user"  # pragma: allowlist secret
      polaris.storage.s3.secretKeySecretKey: "root-password"  # pragma: allowlist secret
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: AWS_ACCESS_KEY_ID
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: floe-platform-minio-credentials
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.key
          value: root-user
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: AWS_SECRET_ACCESS_KEY
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: floe-platform-minio-credentials
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.key
          value: root-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT_URL_S3
            value: http://minio:9000
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POLARIS_STORAGE_AWS_ACCESS_KEY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POLARIS_SERVICE_IDENTITY_AWS_IAM_ACCESS_KEY_ID
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: floe-platform-minio-credentials
                key: root-user
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: floe-platform-minio-credentials
                key: root-password
          any: true

  - it: should source demo runtime S3 credentials from the rendered MinIO secret
    template: templates/deployment-polaris.yaml
    values:
      - ../values-demo.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: AWS_ACCESS_KEY_ID
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: floe-platform-minio
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.key
          value: root-user
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: AWS_SECRET_ACCESS_KEY
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: floe-platform-minio
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.key
          value: root-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            value: us-east-1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT_URL_S3
            value: http://floe-platform-minio:9000
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: floe-platform-minio
                key: root-user
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: floe-platform-minio
                key: root-password
          any: true

  - it: should require explicit S3 credential secret for external S3 storage
    template: templates/deployment-polaris.yaml
    set:
      minio.enabled: false
      polaris.enabled: true
      polaris.storage.s3.enabled: true
      polaris.storage.s3.endpoint: "https://s3.example.com"
    asserts:
      - failedTemplate:
          errorMessage: "polaris.storage.s3.credentialSecretName is required when polaris.storage.s3.enabled=true and minio.enabled=false"

  - it: should query both schema version and Polaris realm state before bootstrapping
    template: templates/deployment-polaris.yaml
    set:
      polaris.enabled: true
      polaris.persistence.type: relational-jdbc
      polaris.persistence.jdbc.url: jdbc:postgresql://floe-platform-postgresql:5432/polaris
      polaris.persistence.jdbc.username: floe
      polaris.auth.bootstrapCredentials.clientId: demo-admin
      polaris.auth.bootstrapCredentials.clientSecret: demo-secret  # pragma: allowlist secret
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "table_schema = 'polaris_schema'"
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "table_name = 'version'"
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "principal_authentication_data"
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "realm_id = 'POLARIS' limit 1"
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "touch /work/polaris-bootstrap-required"

  - it: should derive postgres host and port from the JDBC URL for both init probes
    template: templates/deployment-polaris.yaml
    set:
      polaris.enabled: true
      polaris.persistence.type: relational-jdbc
      polaris.persistence.jdbc.url: jdbc:postgresql://postgres.external:5544/polaris
      polaris.persistence.jdbc.username: floe
      polaris.auth.bootstrapCredentials.clientId: demo-admin
      polaris.auth.bootstrapCredentials.clientSecret: demo-secret  # pragma: allowlist secret
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "PGHOST_PARSED"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "pg_isready -h \\\"\\$\\{PGHOST_PARSED\\}\\\" -p \\\"\\$\\{PGPORT_PARSED\\}\\\""
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "export PGHOST=\\\"\\$\\{PGHOST_PARSED\\}\\\""
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "export PGPORT=\\\"\\$\\{PGPORT_PARSED\\}\\\""

  - it: should use the matching Polaris admin tool image for explicit bootstrap
    template: templates/deployment-polaris.yaml
    set:
      polaris.enabled: true
      polaris.persistence.type: relational-jdbc
      polaris.persistence.jdbc.url: jdbc:postgresql://floe-platform-postgresql:5432/polaris
      polaris.persistence.jdbc.username: floe
      polaris.image.tag: 1.2.0-incubating
      polaris.auth.bootstrapCredentials.clientId: demo-admin
      polaris.auth.bootstrapCredentials.clientSecret: demo-secret  # pragma: allowlist secret
    asserts:
      - equal:
          path: spec.template.spec.initContainers[2].image
          value: apache/polaris-admin-tool:1.2.0-incubating
      - matchRegex:
          path: spec.template.spec.initContainers[2].command[2]
          pattern: 'BOOTSTRAP_CREDENTIALS=\$\(cat /bootstrap/bootstrap-credentials\)'
      - matchRegex:
          path: spec.template.spec.initContainers[2].command[2]
          pattern: 'bootstrap -r POLARIS -c "\$\{BOOTSTRAP_CREDENTIALS\}"'
