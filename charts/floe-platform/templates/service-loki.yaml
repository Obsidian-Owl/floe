{{- if .Values.loki.enabled }}
{{- $lokiName := default (printf "%s-loki" (include "floe-platform.fullname" .)) .Values.loki.fullnameOverride }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $lokiName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "floe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: {{ .Values.loki.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.loki.service.port | default 3100 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "floe-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
{{- end }}
