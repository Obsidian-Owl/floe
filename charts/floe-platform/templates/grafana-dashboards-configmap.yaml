{{- if .Values.observability.grafana.enabled }}
{{- $grafanaDatasources := .Values.observability.grafana.datasources | default list }}
{{- $hasCustomGrafanaDatasources := gt (len $grafanaDatasources) 0 }}
{{- $datasourceUids := .Values.observability.grafana.datasourceUids | default dict }}
{{- $prometheusDatasourceUid := (get $datasourceUids "prometheus") | default (.Values.observability.grafana.datasourceUid | default "prometheus") }}
{{- $lokiDatasourceUid := (get $datasourceUids "loki") | default "loki" }}
{{- $jaegerDatasourceUid := (get $datasourceUids "jaeger") | default "jaeger" }}
{{- $customDatasourceUids := list }}
{{- range $grafanaDatasources }}
{{- if .uid }}
{{- $customDatasourceUids = append $customDatasourceUids (tpl (toString .uid) $) }}
{{- end }}
{{- end }}
{{- if $hasCustomGrafanaDatasources }}
{{- if and .Values.prometheus.enabled (not (has $prometheusDatasourceUid $customDatasourceUids)) }}
{{- fail (printf "dashboard_datasource_drift: Prometheus dashboards require datasource UID %q, but observability.grafana.datasources provides UIDs %v. Set observability.grafana.datasourceUids.prometheus to the custom Prometheus UID or provide a datasource with the expected UID." $prometheusDatasourceUid $customDatasourceUids) }}
{{- end }}
{{- if and .Values.prometheus.enabled .Values.loki.enabled (not (has $lokiDatasourceUid $customDatasourceUids)) }}
{{- fail (printf "dashboard_datasource_drift: Loki dashboard panels require datasource UID %q, but observability.grafana.datasources provides UIDs %v. Set observability.grafana.datasourceUids.loki to the custom Loki UID or provide a datasource with the expected UID." $lokiDatasourceUid $customDatasourceUids) }}
{{- end }}
{{- end }}
{{- $dashboardContext := merge (dict "PrometheusDatasourceUid" $prometheusDatasourceUid "LokiDatasourceUid" $lokiDatasourceUid "JaegerDatasourceUid" $jaegerDatasourceUid "GrafanaRefreshInterval" (.Values.observability.grafana.refreshInterval | default "30s")) . }}
{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "floe-platform.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "floe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
    grafana_dashboard: "1"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
data:
  pipeline-metrics.json: |
{{ tpl (.Files.Get "dashboards/pipeline-metrics.json") $dashboardContext | indent 4 }}
  {{- if and .Values.prometheus.enabled .Values.loki.enabled }}
  observability-backends.json: |
    {
      "uid": "floe-observability-backends",
      "title": "Floe Backend Operability",
      "tags": ["floe", "alpha", "otel", "logs", "metrics"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "{{ .Values.observability.grafana.refreshInterval | default "30s" }}",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "OTel Collector Target",
          "targets": [
            {
              "expr": "up{job=\"floe-otel-collector\"}",
              "legendFormat": "otel collector",
              "refId": "A"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "{{ $prometheusDatasourceUid }}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Prometheus Target",
          "targets": [
            {
              "expr": "up{job=\"floe-prometheus\"}",
              "legendFormat": "prometheus",
              "refId": "A"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "{{ $prometheusDatasourceUid }}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Customer 360 Materializations",
          "targets": [
            {
              "expr": "sum by (floe_stage, floe_status, floe_plugin_name) (increase(floe_asset_materializations_total{floe_product_name=\"customer-360\",floe_status=\"success\"}[15m]))",
              "legendFormat": "{{ "{{floe_stage}}" }} / {{ "{{floe_plugin_name}}" }}",
              "refId": "A"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "{{ $prometheusDatasourceUid }}"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          }
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Floe Logs",
          "targets": [
            {
              "expr": "{service_name=~\".+\"} |= \"customer-360\"",
              "refId": "A"
            }
          ],
          "datasource": {
            "type": "loki",
            "uid": "{{ $lokiDatasourceUid }}"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          }
        }
      ]
    }
  {{- end }}
{{- end }}
{{- if or $hasCustomGrafanaDatasources .Values.prometheus.enabled .Values.loki.enabled .Values.jaeger.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "floe-platform.fullname" . }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "floe-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
    grafana_datasource: "1"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- if $hasCustomGrafanaDatasources }}
{{ tpl (toYaml $grafanaDatasources) . | indent 6 }}
      {{- else }}
      {{- if .Values.prometheus.enabled }}
      - access: proxy
        editable: true
        isDefault: true
        name: Prometheus
        type: prometheus
        uid: {{ $prometheusDatasourceUid }}
        url: http://{{ include "floe-platform.prometheus.fullname" . }}:{{ .Values.prometheus.service.port | default 9090 }}
      {{- end }}
      {{- if .Values.jaeger.enabled }}
      - access: proxy
        editable: true
        name: Jaeger
        type: jaeger
        uid: {{ $jaegerDatasourceUid }}
        url: http://{{ include "floe-platform.jaeger.queryName" . }}:16686
      {{- end }}
      {{- if .Values.loki.enabled }}
      - access: proxy
        editable: true
        name: Loki
        type: loki
        uid: {{ $lokiDatasourceUid }}
        url: http://{{ include "floe-platform.loki.fullname" . }}:{{ .Values.loki.service.port | default 3100 }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
